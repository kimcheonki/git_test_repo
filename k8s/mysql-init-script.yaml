apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS shoppingmall CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    GRANT ALL PRIVILEGES ON shoppingmall.* TO 'root'@'%';
    FLUSH PRIVILEGES;

    USE shoppingmall;

    CREATE TABLE IF NOT EXISTS users (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      username VARCHAR(50) NOT NULL,
      password VARCHAR(100) NOT NULL,
      email VARCHAR(100),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS product (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      description TEXT,
      price DOUBLE,
      stock INT
    );

    INSERT INTO product (name, description, price, stock)
    VALUES
      ('Wireless Mouse', 'Ergonomic 2.4GHz wireless mouse with silent click', 29.99, 120),
      ('Mechanical Keyboard', 'RGB backlit mechanical keyboard with blue switches', 89.00, 75),
      ('USB-C Hub', '7-in-1 USB-C hub with HDMI, SD card reader, and Ethernet', 49.50, 60),
      ('Noise Cancelling Headphones', 'Bluetooth over-ear headphones with active noise cancellation', 129.99, 40);
